# Edit this file to change what the LoRA learns; every key is also a CLI flag.

# 750-step run: step-750 overfit cafe prompts (traced to the cafe instance
# image in instance_example_urls.txt); ckpt-600 was clean on every tested
# prompt — hence the 600 cap and what's served. On retrain also downweight
# that image.

instance_name: Devin
class_name: software engineer
prefix: a photo of
postfix: ""

instance_example_urls_file: instance_example_urls.txt

resolution: 1024
train_batch_size: 1
rank: 16
lora_alpha: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler: constant
lr_warmup_steps: 100
max_train_steps: 600
checkpointing_steps: 100
seed: 117

report_to: wandb
validation_prompts:
  - "{instance} on the moon"
  - "{instance} at a coffee shop"
  - "a watercolor painting of {instance} surfing a wave"
validation_epochs: 50
num_validation_images: 1
