instance_name: Devin
class_name: software engineer
prefix: a photo of
postfix: ""

instance_images_prefix: otterimage/instance_images/

resolution: 1024
train_batch_size: 1
rank: 16
lora_alpha: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler: constant
lr_warmup_steps: 100
max_train_steps: 1000  # 200 epochs at 18 images (5 steps/epoch); 250 epochs overfit
checkpointing_steps: 100
seed: 117

report_to: wandb
validation_prompts:
  - "{instance} on the moon"
  - "{instance} at a coffee shop"
  - "a watercolor painting of {instance} surfing a wave"
validation_epochs: 20
num_validation_images: 1
