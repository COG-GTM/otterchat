# Edit this file to change what the LoRA learns; every key is also a CLI flag.

# 750-step run finding (2026-10, devin-8489e2e302514f8b923589d7384859f0):
# the final step-750 weights overfit cafe prompts (face/cup fusion artifacts
# across seeds), traced to the Paris-cafe instance image in
# instance_example_urls.txt. checkpoint-600 was clean on every tested prompt
# and is what the live endpoint serves. On retrain: drop or downweight that
# image and/or stop around step 600.

instance_name: Devin
class_name: software engineer
prefix: a photo of
postfix: ""

instance_example_urls_file: instance_example_urls.txt

resolution: 1024
train_batch_size: 1
rank: 16
lora_alpha: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler: constant
lr_warmup_steps: 100
max_train_steps: 750
checkpointing_steps: 100
seed: 117

report_to: wandb
validation_prompts:
  - "{instance} on the moon"
  - "{instance} at a coffee shop"
  - "a watercolor painting of {instance} surfing a wave"
validation_epochs: 50
num_validation_images: 1
