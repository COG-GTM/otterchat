name: Chat tests

on:
  pull_request:
    paths:
      - 'apps/chat/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/chat-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/chat/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/chat-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter otterchat test

      - name: Install Playwright Chromium
        run: pnpm --filter otterchat exec playwright install --with-deps chromium

      - name: Accessibility tests
        run: pnpm --filter otterchat test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/chat/playwright-report/
            apps/chat/test-results/
          retention-days: 7
